<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    Resolve all relative paths against the repository ROOT so the renderer
    reuses the existing engine, worker and HUD in place (no fork, no copy).
    overlay.html lives in /desktop, so "../" is the repo root.
  -->
  <base href="../" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self'" />
  <title>Poker Assistant — HUD Overlay</title>
  <link rel="stylesheet" href="desktop/overlay.css" />
</head>
<body>
  <!-- Visor framing (decorative, pointer-events:none) -->
  <div class="visor" aria-hidden="true">
    <span class="visor-arc visor-arc-tl"></span>
    <span class="visor-arc visor-arc-tr"></span>
    <span class="visor-arc visor-arc-bl"></span>
    <span class="visor-arc visor-arc-br"></span>
    <span class="visor-scan"></span>
  </div>

  <!--
    Reused, unchanged HUD renderer: hud-layout.js (pure geometry) + hud.js
    (Shadow-DOM 3-panel HUD, drag/resize/reflow/persistence, equity via the
    reused js/worker.js). overlay-logic.js provides desktop hit-testing to the
    bridge. overlay-bridge.js mounts the HUD and wires it to Electron.
  -->
  <script src="extension/hud-layout.js"></script>
  <script src="desktop/overlay-logic.js"></script>
  <script src="extension/calibration-toggle.js"></script>
  <script src="js/calibration-preset.js"></script>
  <script src="extension/hud.js"></script>
  <script src="desktop/overlay-bridge.js"></script>
  <script src="extension/calibration-layer.js"></script>
</body>
</html>
